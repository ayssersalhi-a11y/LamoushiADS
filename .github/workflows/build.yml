name: Build Android Plugin
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Wrapper
        run: |
          cd android-plugin
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build with Gradle
        run: |
          cd android-plugin
          ./gradlew assembleRelease

      - name: Prepare Plugin Folder
        run: |
          mkdir -p plugin-output/android/plugins/LamoushiAds

          cp android-plugin/build/outputs/aar/LamoushiAds-release.aar \
             plugin-output/android/plugins/LamoushiAds/

          cat > plugin-output/android/plugins/LamoushiAds/LamoushiAds.gdap << 'EOF'
          [config]
          name="LamoushiAds"
          binary_type="local"
          binary="LamoushiAds-release.aar"

          [dependencies]
          local=[]
          remote=[]
          custom_rules=[]
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LamoushiAds_Plugin_Ready
          path: plugin-output/
