name: Build Android Plugin
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Wrapper
        run: |
          cd android-plugin
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew
      - name: Commit Gradle Wrapper for JitPack
        run: |
          cd android-plugin
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f gradlew gradlew.bat gradle/wrapper
          git diff --staged --quiet || (git commit -m "chore: commit gradle wrapper" && git push)
      - name: Build with Gradle
        run: |
          cd android-plugin
          ./gradlew assembleRelease

      - name: Prepare Plugin Folder
        run: |
          mkdir -p plugin-output/android/plugins

          cp android-plugin/build/outputs/aar/LamoushiAds-release.aar \
             plugin-output/android/plugins/ads.aar

          cat > plugin-output/android/plugins/ads.gdap << 'EOF'
          [config]
          name="LamoushiAds"
          binary_type="local"
          binary="ads.aar"

          [dependencies]
          local=[]
          remote=[]
          custom_rules=[]
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LamoushiAds_Plugin_Ready
          path: plugin-output/

      - name: Set version tag
        if: github.event_name == 'push'
        id: tag
        run: echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: plugin-output/android/plugins/ads.aar
