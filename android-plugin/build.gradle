buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // هذا السطر ضروري لتعريف نظام بناء الأندرويد
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

apply plugin: 'com.android.library'

android {
    // الـ namespace هنا يغنينا عن كتابته في الـ Manifest ويمنع تضارب الأسماء
    namespace 'com.lamoushi.ads'
    compileSdk 33

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
    // --- الإضافة الضرورية هنا ---
    maven { url 'https://jitpack.io' } 
    // ---------------------------
    maven { url "https://plugins.gradle.org/m2/" }
}

dependencies {
    compileOnly "org.godotengine:godot:4.2.0.stable"
    // لا نحتاج لأي مكتبات خارجية الآن!
}
